name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# The gate is defined once, in scripts/check.sh (docs/00-foundations.md F12).
# This workflow installs the toolchain and calls it. It must never re-list the
# individual steps -- that is how the two drift apart.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir web exec playwright install --with-deps chromium firefox msedge

      - name: Run the gate
        run: scripts/check.sh
