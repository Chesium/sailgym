# The repository's Python workspace (v2 section 03, task 3.1).
#
# One workspace at the repository root, managed by `uv`, exactly as `web/` is
# one pnpm workspace and `crates/` one cargo workspace. `uv.lock` is committed
# for the same reason `web/pnpm-lock.yaml` and `Cargo.lock` are, and for the
# same reason F9.2 hand-rolls PCG32: a toolchain that can drift under you is
# not a reference. A conformance runner whose dependency set changed between
# two runs would report a difference it could not attribute.
#
# `requires-python` is pinned to an exact minor version rather than a floor.
# A floor lets the interpreter move under a recorded measurement; the two-arm
# divergence this section reports is a property of a numerical stack, and the
# interpreter is part of it.
#
# There is no `pip`, no `conda` and no `requirements.txt` (PRD 03, "What this
# section does not do").
#
# Section 07 made this a **uv workspace**. The root project is still one
# distribution — the three importable packages under `python/` — and
# `crates/sailgym-py` is a second, built by `maturin` from Rust. They are
# separated because they are built by different backends, not because they are
# different projects: `hatchling` cannot compile a cdylib and `maturin` does
# not want three unrelated pure-Python packages.

[project]
name = "sailgym"
version = "0.0.0"
description = "sailgym — the Python side: the conformance bundle loader and the JAX verification implementation"
requires-python = "==3.12.*"
dependencies = [
    "jax",
    "numpy",
    "pytest",
    # Section 07. Pinned to an exact version rather than a floor, for the same
    # reason `requires-python` is: F17.4 makes the autoreset convention part of
    # the contract, `python/sailgym/vector.py` reads it out of **this** release
    # (`gymnasium.vector.AutoresetMode` and `SyncVectorEnv`'s declared default)
    # and `docs/v2/progress/07-handoff.md` records what it found. A floor would
    # let that convention move under a recorded measurement.
    "gymnasium==1.3.0",
    # The compiled core. A workspace member, resolved by `[tool.uv.sources]`
    # below; `python/sailgym/` is useless without it, so it is a dependency and
    # not an extra.
    "sailgym-core",
]

[dependency-groups]
dev = [
    "ruff",
    # Section 07: `scripts/py-test.{sh,ps1}` runs `maturin develop` in front of
    # `pytest`, which is the whole reason F12' step 11 is a script (D3).
    "maturin>=1.9,<2",
]

# The `uv` workspace. One member, and it is the Rust binding: two build
# backends in one `pyproject.toml` is not a thing, so the extension gets its
# own project file beside its `Cargo.toml`.
[tool.uv.workspace]
members = ["crates/sailgym-py"]

[tool.uv.sources]
sailgym-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Three packages in one project, in the three scopes F17.1 audits separately:
# `sailgym_conformance` is stack-neutral and holds no equation, `sailgym_jax`
# is the independent verification implementation and therefore holds the
# equations it tests, and `sailgym` (section 07) is **wrapper scope** — the
# same rule as `sailgym_conformance`, and the audit that enforces it is
# `python/tests/test_no_stray_constants.py`.
[tool.hatch.build.targets.wheel]
packages = ["python/sailgym", "python/sailgym_conformance", "python/sailgym_jax"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
# `-q` keeps a green run short; the tier-0 and tier-3 tests print their
# measured numbers through `-s`-independent `warnings`-free stderr writes, so
# the numbers this section has to report are visible without a flag.
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["sailgym", "sailgym_conformance", "sailgym_core", "sailgym_jax"]
