[workspace]
resolver = "2"
members = [
    "crates/sailgym-physics",
    "crates/sailgym-task",
    "crates/sailgym-course",
    "crates/sailgym-agent",
    "crates/sailgym-env",
    "crates/sailgym-py",
    "crates/sailgym-wasm",
    "crates/sailgym-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
sailgym-physics = { path = "crates/sailgym-physics" }
sailgym-task = { path = "crates/sailgym-task" }
sailgym-course = { path = "crates/sailgym-course" }
sailgym-agent = { path = "crates/sailgym-agent" }
sailgym-env = { path = "crates/sailgym-env" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
