[workspace]
resolver = "2"
members = [
    "crates/sailgym-physics",
    "crates/sailgym-wasm",
    "crates/sailgym-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
sailgym-physics = { path = "crates/sailgym-physics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
