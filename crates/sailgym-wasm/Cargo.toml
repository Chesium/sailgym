[package]
name = "sailgym-wasm"
description = "Thin wasm_bindgen wrapper over sailgym-physics (F8.1, F8.2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sailgym-physics = { workspace = true }
# v2 section 11: practice evaluation. The arrow points `wasm → task → physics`
# (v2 F14.1); `sailgym-physics` gains no dependency from this, which
# `sailgym-task`'s `physics_does_not_depend_on_the_task_crate` asserts.
sailgym-task = { workspace = true }
# v2 section 12, D5: course challenges and the rule-sailor baseline. The
# baseline runs through `sailgym-env`'s `Episode` inside one coarse
# `run_baseline` call — never a boundary crossing per decision (brief §24) —
# so the agent runs in Rust, as it does natively. The browser never builds a
# `VecEnv`; `cargo build -p sailgym-env --target wasm32-unknown-unknown` was
# measured to succeed on 2026-10-02. `sailgym-physics` gains no dependency
# from any of these three.
sailgym-course = { workspace = true }
sailgym-agent = { workspace = true }
sailgym-env = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = { workspace = true }

# wasm-bindgen-test only builds for wasm targets; keeping it target-gated lets
# `cargo build --workspace` and `cargo clippy --all-targets` run on the host.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# `js-sys` is a **dev**-dependency: task 8.1's boundary test asserts that the
# diagnostics record round-trips through the browser's own `JSON.parse`, which
# needs `js_sys::JSON`. The shipped crate still marshals nothing but strings
# and flat buffers, and `cargo tree -p sailgym-wasm` shows no js-sys in the
# default feature set.
js-sys = "0.3"
