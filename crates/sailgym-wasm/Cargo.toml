[package]
name = "sailgym-wasm"
description = "Thin wasm_bindgen wrapper over sailgym-physics (F8.1, F8.2)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sailgym-physics = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = { workspace = true }

# wasm-bindgen-test only builds for wasm targets; keeping it target-gated lets
# `cargo build --workspace` and `cargo clippy --all-targets` run on the host.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
